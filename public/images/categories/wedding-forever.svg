  <line x1="70"  y1="135" x2="230" y2="135" stroke="#ffffff" stroke-width="0.6" opacity="0.2"/>
  <line x1="150" y1="55"  x2="100" y2="135" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <line x1="150" y1="55"  x2="200" y2="135" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <!-- ring band -->
