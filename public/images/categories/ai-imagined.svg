<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="none">
  <defs>
    <filter id="g1"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="g2"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <!-- glow background -->
  <ellipse cx="150" cy="190" rx="110" ry="140" fill="#00E5FF" opacity="0.09" filter="url(#g1)"/>
  <!-- outer ring -->
  <circle cx="150" cy="190" r="100" stroke="#00E5FF" stroke-width="0.8" opacity="0.25" stroke-dasharray="6 4"/>
  <!-- middle ring -->
  <circle cx="150" cy="190" r="65" stroke="#00E5FF" stroke-width="0.6" opacity="0.35"/>
  <!-- neural nodes -->
  <circle cx="150" cy="90" r="10" fill="#00E5FF" opacity="0.9"/>
  <circle cx="80"  cy="155" r="8"  fill="#00E5FF" opacity="0.75"/>
  <circle cx="220" cy="155" r="8"  fill="#00E5FF" opacity="0.75"/>
  <circle cx="100" cy="265" r="9"  fill="#00E5FF" opacity="0.8"/>
  <circle cx="200" cy="265" r="9"  fill="#00E5FF" opacity="0.8"/>
  <circle cx="150" cy="310" r="10" fill="#00E5FF" opacity="0.7"/>
  <!-- connections -->
  <line x1="150" y1="90"  x2="80"  y2="155" stroke="#00E5FF" stroke-width="1.2" opacity="0.3"/>
  <line x1="150" y1="90"  x2="220" y2="155" stroke="#00E5FF" stroke-width="1.2" opacity="0.3"/>
  <line x1="80"  y1="155" x2="100" y2="265" stroke="#00E5FF" stroke-width="1.2" opacity="0.3"/>
  <line x1="80"  y1="155" x2="200" y2="265" stroke="#00E5FF" stroke-width="1.2" opacity="0.2"/>
  <line x1="220" y1="155" x2="100" y2="265" stroke="#00E5FF" stroke-width="1.2" opacity="0.2"/>
  <line x1="220" y1="155" x2="200" y2="265" stroke="#00E5FF" stroke-width="1.2" opacity="0.3"/>
  <line x1="100" y1="265" x2="150" y2="310" stroke="#00E5FF" stroke-width="1.2" opacity="0.3"/>
  <line x1="200" y1="265" x2="150" y2="310" stroke="#00E5FF" stroke-width="1.2" opacity="0.3"/>
  <!-- core glow -->
  <circle cx="150" cy="190" r="22" fill="#00E5FF" opacity="0.12" filter="url(#g2)"/>
  <circle cx="150" cy="190" r="8"  fill="#00E5FF" opacity="0.6"/>
  <circle cx="150" cy="190" r="3"  fill="#ffffff" opacity="0.9"/>
</svg>
