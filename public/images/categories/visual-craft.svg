<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="none">
  <defs><filter id="g"><feGaussianBlur stdDeviation="14"/></filter></defs>
  <ellipse cx="150" cy="190" rx="120" ry="100" fill="#10B981" opacity="0.1" filter="url(#g)"/>
  <!-- eye outline -->
  <path d="M 30 190 Q 150 80 270 190 Q 150 300 30 190 Z"
        stroke="#10B981" stroke-width="2" opacity="0.7" fill="none"/>
  <!-- iris -->
  <circle cx="150" cy="190" r="45" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
  <circle cx="150" cy="190" r="30" fill="#10B981" opacity="0.85"/>
  <!-- pupil -->
  <circle cx="150" cy="190" r="14" fill="#0a0a0a" opacity="0.9"/>
  <circle cx="150" cy="190" r="5"  fill="#ffffff" opacity="0.9"/>
  <!-- catchlight -->
  <circle cx="158" cy="183" r="4"  fill="#ffffff" opacity="0.6"/>
  <!-- eyelash lines -->
  <line x1="80"  y1="148" x2="88"  y2="160" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <line x1="110" y1="128" x2="115" y2="142" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <line x1="150" y1="120" x2="150" y2="136" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <line x1="190" y1="128" x2="185" y2="142" stroke="#10B981" stroke-width="1" opacity="0.4"/>
  <line x1="220" y1="148" x2="212" y2="160" stroke="#10B981" stroke-width="1" opacity="0.4"/>
</svg>
